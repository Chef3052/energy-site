<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Альтернативные источники энергии</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: Arial, sans-serif;
      background-color: #F5F5DC;
      height: 100vh;
      overflow: hidden;
    }
    
    .container {
      display: flex;
      height: 100vh;
    }
    
    /* Стили для левой панели навигации */
    .nav-panel {
      width: 250px;
      background-color: #F5F5DC;
      padding: 15px;
      border-right: 2px solid #ccc;
      overflow-y: auto;
      height: 100%;
      flex-shrink: 0;
    }
    
    .nav-logo {
      display: block;
      margin: 0 auto 20px;
      width: 80px;
      border-radius: 5px;
    }
    
    .nav-title {
      color: #FFC107;
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.5em;
    }
    
    .nav-links {
      display: flex;
      flex-direction: column;
    }
    
    .nav-link {
      display: block;
      padding: 12px 15px;
      margin: 8px 0;
      border: 2px solid #007BFF;
      border-radius: 8px;
      text-decoration: none;
      color: #007BFF;
      font-weight: bold;
      text-align: center;
      transition: all 0.3s ease;
      background-color: white;
    }
    
    .nav-link:hover, .nav-link.active {
      background-color: #007BFF;
      color: white;
      border-color: #0056B3;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    
    .nav-info {
      margin-top: 20px;
      font-size: 12px;
      color: #666;
      text-align: center;
      border-top: 1px solid #ddd;
      padding-top: 10px;
    }
    
    /* Стили для правой панели контента */
    .content-panel {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background-color: #F5F5DC;
    }
    
    .content {
      max-width: 900px;
      margin: 0 auto;
      background-color: rgba(255, 255, 255, 0.8);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    
    /* Специальный стиль для главной страницы с фоновым изображением */
    .main-page-bg {
      background-image: url('https://profholod.ru/upload/medialibrary/490/u6v86przwouzjmbsz709nd0wp0x39071/%D0%A1%D0%BE%D0%BB%D0%BD%D0%B5%D1%87%D0%BD%D1%8B%D0%B5%20%D0%BF%D0%B0%D0%BD%D0%B5%D0%BB%D0%B8.jpg');
      background-size: cover;
      background-position: center;
    }
    
    h1 {
      color: #FFC107;
      margin-bottom: 20px;
    }
    
    p {
      font-family: 'Times New Roman', serif;
      font-weight: bold;
      font-size: 20px;
      margin-bottom: 15px;
    }
    
    marquee {
      font-style: italic;
      font-weight: normal;
    }
    
    .logo {
      width: 100px;
      margin-right: 20px;
      float: left;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    
    td {
      vertical-align: top;
      padding: 10px;
    }
    
    img {
      max-width: 100%;
    }
    
    ul {
      margin-left: 20px;
      margin-bottom: 20px;
    }
    
    form {
      margin-top: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    
    input, select, textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    
    button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    
    button:hover {
      background-color: #0056B3;
    }
    
    iframe {
      width: 100%;
      height: 315px;
      border: none;
      margin-top: 20px;
    }
  </style>
</head>
